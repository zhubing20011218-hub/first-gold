<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
<style>

@keyframes wbob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes wpuff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(6px,-26px) scale(1.4)}}
@keyframes wflow{to{stroke-dashoffset:-40}}
@keyframes wspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.3)}}
@keyframes whop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.wbob{animation:wbob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wpuff{animation:wpuff 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.wpuff2{animation:wpuff 2s ease-out .7s infinite;transform-box:fill-box;transform-origin:center}
.wflow{animation:wflow 1.4s linear infinite}
.wspin{animation:wspin 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.whop{animation:whop 1.1s ease-in-out infinite;transform-box:fill-box}
</style>
    <!-- 天和海 -->

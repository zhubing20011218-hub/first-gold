# 第一桶金(试玩版)的网站容器。服务器路径:/opt/prismice/first-gold
# 只接入 prismice_app-network,不对外开放端口;公网 HTTPS 由主站网关 prismice-caddy-1 转发 test.prismice.cn 到这里
# (网关配置在 eureka-saas 仓库 deploy/hk-server/Caddyfile)。
name: prismice-first-gold

services:
  site:
    image: caddy:2.11.4-alpine
    container_name: prismice-first-gold
    restart: unless-stopped
    volumes:
      - ./site:/srv:ro
      - ./conf:/etc/caddy:ro   # 挂整个文件夹:配置文件被替换后容器也能读到新内容
    mem_limit: 64m
    networks:
      - prismice_app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  prismice_app-network:
    external: true
